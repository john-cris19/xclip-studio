name: XClip public smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - "config.js"
      - "studio.js"
      - ".github/workflows/xclip-smoke.yml"
jobs:
  public-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test published site config
        shell: bash
        run: |
          curl -fsSL --retry 2 --max-time 18 "https://john-cris19.github.io/xclip-studio/config.js" -o config.js
          grep -q 'window.XCLIP_CONFIG' config.js
          grep -q 'xclip-link-fallback' config.js
          echo "Site config reachable"
      - name: Test Cloudflare resolver health
        shell: bash
        run: |
          curl -fsSL --retry 2 --max-time 20 "https://xclip-link-fallback.johncrissaints.workers.dev/api/health"
      - name: Diagnose a public X example (non-blocking)
        shell: bash
        run: |
          curl -sS -L --max-time 30 --get \
            --data-urlencode "url=https://x.com/TheMagicBR/status/2111961692557222032" \
            "https://xclip-link-fallback.johncrissaints.workers.dev/api/resolve" \
            -o /tmp/xclip-resolve.json -w 'status:%{http_code}\n'
          head -c 900 /tmp/xclip-resolve.json
          echo

      - name: Diagnose resolver upstream and test known video
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          samples=['1548602399862013953','2111668932268687822','2111795836464288080']
          for id in samples:
            endpoints=[
              'https://api.fxtwitter.com/dangeredwolf/status/'+id,
              'https://api.fxtwitter.com/2/status/'+id,
              'https://cdn.syndication.twimg.com/tweet-result?id='+id+'&lang=en',
              'https://xclip-link-fallback.johncrissaints.workers.dev/api/resolve?url='+urllib.parse.quote('https://x.com/dangeredwolf/status/'+id,safe=''),
            ]
            for url in endpoints:
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'XClip/1.6 (public media diagnostics)','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=12) as res:
                  text=res.read(120000).decode('utf-8','replace');status=res.status
                try:
                  obj=json.loads(text);summ={'keys':list(obj)[:12], 'code':obj.get('code'),'message':obj.get('message'),'error':obj.get('error'),'media':(obj.get('tweet') or obj.get('status') or {}).get('media'),'formats':obj.get('formats')}
                  if summ.get('media'):summ['media']=str(summ['media'])[:380]
                  print(id,url.split('/')[2],url.split('/')[3][:30],status,summ,flush=True)
                except Exception as e:print(id,url[:55],status,text[:180],flush=True)
              except Exception as e:print(id,url[:55],'ERROR',str(e)[:150],flush=True)
          PY

      - name: Check Cloudflare worker upstream diagnostics
        shell: bash
        run: |
          curl -fsSL --max-time 30 "https://xclip-link-fallback.johncrissaints.workers.dev/api/debug?id=2111668932268687822"
          echo
          curl -fsSL --max-time 30 "https://xclip-link-fallback.johncrissaints.workers.dev/api/debug?id=2111795836464288080"
          echo

      - name: Verify actual MP4 bytes returned by Cloudflare
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, urllib.parse
          base='https://xclip-link-fallback.johncrissaints.workers.dev'
          for post in ['2111795836464288080','2111961692557222032','2111668932268687822','2111985924766634420']:
            try:
              u=base+'/api/resolve?url='+urllib.parse.quote('https://x.com/user/status/'+post,safe='')
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 XClipSmoke/1.6','Accept':'application/json'}),timeout=30) as r: data=json.load(r)
              print('resolve',post,data.get('formats'),flush=True)
              if not data.get('formats'):continue
              with urllib.request.urlopen(urllib.request.Request(base+'/api/video?tweet='+post+'&q=q0',headers={'User-Agent':'Mozilla/5.0 XClipSmoke/1.6'}),timeout=40) as r:
                prefix=r.read(32);print('MP4 STREAM',post,r.status,r.headers.get('content-type'),prefix.hex(),flush=True)
            except urllib.error.HTTPError as e:print('HTTP ERROR',post,e.code,e.read(350),flush=True)
            except Exception as e:print('ERROR',post,repr(e),flush=True)
          PY


      - name: Download and decode X MP4 through the public resolver
        shell: bash
        run: |
          curl -fsSL --retry 1 --max-time 35 "https://xclip-link-fallback.johncrissaints.workers.dev/api/video?tweet=2111668932268687822&q=q0" -o /tmp/xclip-actual-video.mp4
          file /tmp/xclip-actual-video.mp4
          python3 -m venv /tmp/xclip-ffmpeg-env
          /tmp/xclip-ffmpeg-env/bin/pip -q install imageio-ffmpeg
          FFMPEG=$(/tmp/xclip-ffmpeg-env/bin/python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FFMPEG" -hide_banner -loglevel error -y -i /tmp/xclip-actual-video.mp4 -vf 'fps=4,scale=240:-1:flags=lanczos' -t 2 /tmp/xclip-smoke.gif
          file /tmp/xclip-smoke.gif
          test -s /tmp/xclip-smoke.gif
          echo "PUBLIC MP4 + GIF TRANSCODE SUCCEEDED"
